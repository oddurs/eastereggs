name: Suggest an Easter egg
description: Found something delightful in a codebase? Leave a source trail.
title: 'Easter egg: '
body:
  - type: input
    id: source
    attributes:
      label: Source or commit URL
      description: A source file, commit, or original version-control history.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: The story
      description: What did you find, and how can someone else find it?
    validations:
      required: true
